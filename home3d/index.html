<style>
/* 전면 3D 캔버스 위에 반투명 도면 패널을 얹는 구성 */
:root{
  --bg:#e8eae4; --scene:#e6e8e2; --ink:#1e2420; --muted:#5d665f; --line:#cfd4cb;
  --panel:rgba(249,250,246,.93); --chip:#eef0ea; --accent:#2e6a55; --accent-ink:#ffffff;
  --label-bg:rgba(255,255,252,.88);
  --f-display:"Gowun Batang", "Noto Serif KR", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141715; --scene:#1a1e1b; --ink:#e6eae5; --muted:#99a29b; --line:#323a34;
  --panel:rgba(26,30,27,.92); --chip:#242a26; --accent:#86c7ab; --accent-ink:#0e1a14;
  --label-bg:rgba(24,28,25,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --scene:#1a1e1b; --ink:#e6eae5; --muted:#99a29b; --line:#323a34;
  --panel:rgba(26,30,27,.92); --chip:#242a26; --accent:#86c7ab; --accent-ink:#0e1a14;
  --label-bg:rgba(24,28,25,.85); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
#stage{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage canvas{display:block}
.panel{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top, 0px));left:calc(14px + env(safe-area-inset-left, 0px));
  width:300px;max-width:calc(100% - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.2;text-wrap:balance}
.sub{margin:3px 0 0;color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:500 13px var(--f-body);padding:7px 0;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:13px var(--f-body);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px}
.card{position:fixed;z-index:5;right:calc(14px + env(safe-area-inset-right, 0px));top:calc(14px + env(safe-area-inset-top, 0px));
  width:220px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 8px;font-family:var(--f-display);font-size:19px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.card dt{color:var(--muted)} .card dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.walkbtn{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 14px var(--f-body);padding:10px;cursor:pointer}
/* 휴대폰: 화면 아래 12%에 흐린 발자국 — 발자국 아래를 누르면 뒤로, 바닥을 누르면 그쪽으로 걷기 (공공의 미술관과 같은 방식) */
.backzone{position:fixed;left:0;right:0;bottom:calc(12% - 20px);height:40px;z-index:4;pointer-events:none;display:none;align-items:center;justify-content:center;color:rgba(70,44,20,.35)}
body.walking.coarse .backzone{display:flex}

#cross{position:fixed;z-index:4;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
body.walking .panel .seg, body.walking .panel .legend, body.walking .panel .toggle, body.walking .panel .stats, body.walking .card, body.walking .panel h1, body.walking .panel .sub{display:none}
body.walking .panel{padding:8px;gap:8px}
body.walking .chips{flex-wrap:nowrap;overflow-x:auto}
body.walking .chip{flex:none}
.fovrow{display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
body.walking .fovrow{display:flex}
.fovrow input{flex:1;min-width:0;accent-color:var(--accent)}
.card .walk{margin-top:12px;width:100%;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:500 13px var(--f-body);padding:8px;cursor:pointer}
.bar{position:fixed;z-index:5;left:calc(14px + env(safe-area-inset-left, 0px));right:calc(14px + env(safe-area-inset-right, 0px));
  bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.hint{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#reset{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.lbl{font:500 12px var(--f-body);color:var(--ink);background:var(--label-bg);border:1px solid var(--line);padding:2px 7px;border-radius:5px;white-space:nowrap;pointer-events:none}
.lbl.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbl.minor{font-size:10.5px;opacity:.8}
.lbl.pick{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.nolabels .lbl{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:2px}
.lg-load{background:#a39d92}.lg-int{background:#f3f2ee;border:1px solid #c9c7c0}.lg-glass{background:#9fcde0}
.ptop{display:flex;align-items:flex-start;gap:6px}
.ptitle{flex:1;min-width:0}
.pbtn{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 12px var(--f-body);padding:5px 9px;border-radius:999px;cursor:pointer}
.opts{display:none;flex-direction:column;gap:8px}
body.optopen .opts{display:flex}
#optBtn{display:none}
body.pmin .panel > :not(.ptop){display:none !important}
body.pmin .panel .sub{display:none}
body.pmin .panel{padding:8px 10px;width:auto;right:auto}
body.pmin #optBtn{display:none !important}
@media (max-width:640px){#optBtn{display:inline-block} .sub{display:none} .ptop h1{font-size:17px}}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
@media (max-width:640px){
  .panel{width:auto;right:calc(14px + env(safe-area-inset-right, 0px));padding:10px;gap:8px}
  h1{font-size:18px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .chip{flex:none}
  .stats{display:none}
  .card{top:auto;bottom:calc(64px + env(safe-area-inset-bottom, 0px));left:calc(14px + env(safe-area-inset-left, 0px));width:auto}
  .hint{display:none}
}
</style>

<div id="stage"></div>

</head>
<body>
<header class="panel">
  <div class="ptop">
    <div class="ptitle"><h1>랜선집들이</h1>
    <p class="sub">평면도 치수 기준 · 확장·철거 반영 · 천장고 2.3m 가정</p></div>
    <button type="button" class="pbtn" id="optBtn" aria-expanded="false">옵션</button>
    <button type="button" class="pbtn" id="minBtn" aria-expanded="true">접기</button>
  </div>
  <div class="seg" role="group" aria-label="보기 방식">
    <button id="m-full" data-mode="full" aria-pressed="true">입체</button>
    <button id="m-cut" data-mode="cut" aria-pressed="false">단면</button>
    <button id="m-plan" data-mode="plan" aria-pressed="false">평면</button>
  </div>
  <div class="chips" id="chips" aria-label="방 바로가기"></div>
  <div class="opts" id="opts">
  <div class="legend" aria-label="벽 범례"><span><i class="lg-load"></i>내력벽(단면·평면 보기)</span><span><i class="lg-int"></i>일반 벽</span><span><i class="lg-glass"></i>유리문·창·폴딩도어</span><span><i style="background:#1f2022"></i>미닫이문</span></div>
  <label class="toggle"><input type="checkbox" id="showLabels"> 방 이름 표시</label>
  <label class="toggle"><input type="checkbox" id="showFrames" checked> 액자 배치안 보기</label>
  <label class="toggle"><input type="checkbox" id="showSug"> 거실 인테리어 제안 보기</label>
  <label class="toggle"><input type="checkbox" id="foldDoor"> 현관 중문 열기</label>
  <label class="toggle"><input type="checkbox" id="slideDoor"> 서재 미닫이문 열기</label>
  </div>
  <label class="fovrow">시야 <input type="range" id="fovRange" min="70" max="120" value="100"> 넓게</label>
  <button id="walkBtn" class="walkbtn">1인칭으로 걸어보기</button>
  <div class="stats" id="stats"></div>
</header>
<script>
(function(){const b=document.body,opt=document.getElementById('optBtn'),min=document.getElementById('minBtn');
 const narrow=matchMedia('(max-width:640px)').matches;
 function setOpt(on){b.classList.toggle('optopen',on);opt.setAttribute('aria-expanded',on);opt.textContent=on?'옵션 닫기':'옵션';}
 function setMin(on){b.classList.toggle('pmin',on);min.setAttribute('aria-expanded',!on);min.textContent=on?'메뉴':'접기';}
 setOpt(!narrow);setMin(false);
 opt.onclick=()=>setOpt(!b.classList.contains('optopen'));min.onclick=()=>setMin(!b.classList.contains('pmin'));})();
</script>

function flyTo(p,t,dur){anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:t,s:performance.now(),dur:dur||900};}
function fitDist(base){const a=camera.aspect;return a<1?base/a*1.05:base;}
function overview(){const d=fitDist(1);flyTo(new THREE.Vector3(-4*d,15*d,18*d),new THREE.Vector3(0.4,0,0.2));}
function planView(){flyTo(new THREE.Vector3(0.4,fitDist(25),0.6),new THREE.Vector3(0.4,0,0.2));}
function roomView(k){const r=ROOMS[k];if(r.kind==='common')return;
  if(mode==='plan')setMode('full');
  const [a,b,c,d]=r.r,w=c-a,dp=d-b,cx=W(a+w/2),cz=Z(b+dp/2);
  if(WALK.on){camera.position.set((W(a)+W(c))/2,WALK.eye,cz);return;}
  if(r.kind==='balcony'&&w>6){flyTo(new THREE.Vector3(cx-w*0.42,1.4,cz),new THREE.Vector3(cx+2,1.0,cz));return;}
  if(r.id==='entry'){flyTo(new THREE.Vector3(W(14.9),1.4,Z(0.95)),new THREE.Vector3(W(11.9),1.0,Z(1.6)));return;}
  flyTo(new THREE.Vector3(cx+w*0.33,1.4,cz+dp*0.33),new THREE.Vector3(cx-w*0.12,0.95,cz-dp*0.12));}

  const hit=rc.intersectObjects([...DOORMESH,...floors,...wallMeshes],false).find(h=>shown(h.object));
  if(!(hit&&hit.object.userData.door&&hit.distance<(maxD||99)))return null;const d=hit.object.userData.door;d._hit=hit.object;return d;}
function moveBy(dx,dz){const n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/0.1));let moved=false;
  for(let i=0;i<n;i++){const sx=dx/n,sz=dz/n;
    if(Math.abs(sx)>1e-6&&!blocked(Math.sign(sx),0,Math.abs(sx))){camera.position.x+=sx;moved=true;}
    if(Math.abs(sz)>1e-6&&!blocked(0,Math.sign(sz),Math.abs(sz))){camera.position.z+=sz;moved=true;}}
  return moved;}
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;};

  if(k.has('KeyW')||k.has('ArrowUp'))f++;if(k.has('KeyS')||k.has('ArrowDown'))f--;if(k.has('KeyD'))s++;if(k.has('KeyA'))s--;
  if(k.has('KeyQ')||k.has('ArrowLeft'))turn++;if(k.has('KeyE')||k.has('ArrowRight'))turn--;   // 좌우 방향키는 제자리 회전
  const sp=(k.has('ShiftLeft')||k.has('ShiftRight')?2:1)*2.2;WALK.yaw+=turn*1.8*dt;
  const sy=Math.sin(WALK.yaw),cy=Math.cos(WALK.yaw);

  else if(WALK.auto){const dx=WALK.auto.x-camera.position.x,dz=WALK.auto.z-camera.position.z,d=Math.hypot(dx,dz);
    if(d<0.15)WALK.auto=null;else{const st=Math.min(d,2.6*dt);if(!moveBy(dx/d*st,dz/d*st))WALK.auto=null;
      WALK.yaw+=angDiff(WALK.yaw,Math.atan2(-dx,-dz))*Math.min(1,dt*3);WALK.pitch*=1-Math.min(1,dt*2);
      if(WALK.auto){WALK.auto.t=(WALK.auto.t||0)+dt;if(WALK.auto.t>d/(2.6*(WALK.spK||1))+3)WALK.auto=null;}}}
  if(Math.abs(WALK.wheel)>0.005){const st=WALK.wheel*Math.min(1,dt*8);WALK.wheel-=st;moveBy(-sy*st,-cy*st);}else WALK.wheel=0;
