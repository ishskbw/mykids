<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>인형 숨바꼭질</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 전면 3D 캔버스 위에 반투명 도면 패널을 얹는 구성 */
:root{
  --bg:#e8eae4; --scene:#e6e8e2; --ink:#1e2420; --muted:#5d665f; --line:#cfd4cb;
  --panel:rgba(249,250,246,.93); --chip:#eef0ea; --accent:#2e6a55; --accent-ink:#ffffff;
  --label-bg:rgba(255,255,252,.88);
  --f-display:"Gowun Batang", "Noto Serif KR", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141715; --scene:#1a1e1b; --ink:#e6eae5; --muted:#99a29b; --line:#323a34;
  --panel:rgba(26,30,27,.92); --chip:#242a26; --accent:#86c7ab; --accent-ink:#0e1a14;
  --label-bg:rgba(24,28,25,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --scene:#1a1e1b; --ink:#e6eae5; --muted:#99a29b; --line:#323a34;
  --panel:rgba(26,30,27,.92); --chip:#242a26; --accent:#86c7ab; --accent-ink:#0e1a14;
  --label-bg:rgba(24,28,25,.85); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
#stage{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage canvas{display:block}
.panel{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top, 0px));left:calc(14px + env(safe-area-inset-left, 0px));
  width:300px;max-width:calc(100% - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.2;text-wrap:balance}
.sub{margin:3px 0 0;color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:500 13px var(--f-body);padding:7px 0;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:13px var(--f-body);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px}
.card{position:fixed;z-index:5;right:calc(14px + env(safe-area-inset-right, 0px));top:calc(14px + env(safe-area-inset-top, 0px));
  width:220px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 8px;font-family:var(--f-display);font-size:19px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.card dt{color:var(--muted)} .card dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.walkbtn{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 14px var(--f-body);padding:10px;cursor:pointer}
/* 휴대폰: 화면 아래 12%에 흐린 발자국 — 발자국 아래를 누르면 뒤로, 바닥을 누르면 그쪽으로 걷기 (공공의 미술관과 같은 방식) */
.backzone{position:fixed;left:0;right:0;bottom:calc(12% - 20px);height:40px;z-index:4;pointer-events:none;display:none;align-items:center;justify-content:center;color:rgba(70,44,20,.35)}
body.walking.coarse .backzone{display:flex}

#cross{position:fixed;z-index:4;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
body.walking .panel .seg, body.walking .panel .legend, body.walking .panel .toggle, body.walking .panel .stats, body.walking .card, body.walking .panel h1, body.walking .panel .sub{display:none}
body.walking .panel{padding:8px;gap:8px}
body.walking .chips{flex-wrap:nowrap;overflow-x:auto}
body.walking .chip{flex:none}
.fovrow{display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
body.walking .fovrow{display:flex}
.fovrow input{flex:1;min-width:0;accent-color:var(--accent)}
.card .walk{margin-top:12px;width:100%;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:500 13px var(--f-body);padding:8px;cursor:pointer}
.bar{position:fixed;z-index:5;left:calc(14px + env(safe-area-inset-left, 0px));right:calc(14px + env(safe-area-inset-right, 0px));
  bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.hint{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#reset{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.lbl{font:500 12px var(--f-body);color:var(--ink);background:var(--label-bg);border:1px solid var(--line);padding:2px 7px;border-radius:5px;white-space:nowrap;pointer-events:none}
.lbl.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbl.minor{font-size:10.5px;opacity:.8}
.lbl.pick{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.nolabels .lbl{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:2px}
.lg-load{background:#a39d92}.lg-int{background:#f3f2ee;border:1px solid #c9c7c0}.lg-glass{background:#9fcde0}
.ptop{display:flex;align-items:flex-start;gap:6px}
.ptitle{flex:1;min-width:0}
.pbtn{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 12px var(--f-body);padding:5px 9px;border-radius:999px;cursor:pointer}
.opts{display:none;flex-direction:column;gap:8px}
body.optopen .opts{display:flex}
#optBtn{display:none}
body.pmin .panel > :not(.ptop){display:none !important}
body.pmin .panel .sub{display:none}
body.pmin .panel{padding:8px 10px;width:auto;right:auto}
body.pmin #optBtn{display:none !important}
@media (max-width:640px){#optBtn{display:inline-block} .sub{display:none} .ptop h1{font-size:17px}}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
@media (max-width:640px){
  .panel{width:auto;right:calc(14px + env(safe-area-inset-right, 0px));padding:10px;gap:8px}
  h1{font-size:18px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .chip{flex:none}
  .stats{display:none}
  .card{top:auto;bottom:calc(64px + env(safe-area-inset-bottom, 0px));left:calc(14px + env(safe-area-inset-left, 0px));width:auto}
  .hint{display:none}
}
</style>

<div id="stage"></div>

</head>
<body>
<header class="panel">
  <div class="ptop">
    <div class="ptitle"><h1>우리집 3D</h1>
    <p class="sub">평면도 치수 기준 · 확장·철거 반영 · 천장고 2.3m 가정</p></div>
    <button type="button" class="pbtn" id="optBtn" aria-expanded="false">옵션</button>
    <button type="button" class="pbtn" id="minBtn" aria-expanded="true">접기</button>
  </div>
  <div class="seg" role="group" aria-label="보기 방식">
    <button id="m-full" data-mode="full" aria-pressed="true">입체</button>
    <button id="m-cut" data-mode="cut" aria-pressed="false">단면</button>
    <button id="m-plan" data-mode="plan" aria-pressed="false">평면</button>
  </div>
  <div class="chips" id="chips" aria-label="방 바로가기"></div>
  <div class="opts" id="opts">
  <div class="legend" aria-label="벽 범례"><span><i class="lg-load"></i>내력벽(단면·평면 보기)</span><span><i class="lg-int"></i>일반 벽</span><span><i class="lg-glass"></i>유리문·창·폴딩도어</span><span><i style="background:#1f2022"></i>미닫이문</span></div>
  <label class="toggle"><input type="checkbox" id="showLabels"> 방 이름 표시</label>
  <label class="toggle"><input type="checkbox" id="showFrames" checked> 액자 배치안 보기</label>
  <label class="toggle"><input type="checkbox" id="showSug"> 거실 인테리어 제안 보기</label>
  <label class="toggle"><input type="checkbox" id="foldDoor"> 현관 중문 열기</label>
  <label class="toggle"><input type="checkbox" id="slideDoor"> 서재 미닫이문 열기</label>
  </div>
  <label class="fovrow">시야 <input type="range" id="fovRange" min="70" max="120" value="100"> 넓게</label>
  <button id="walkBtn" class="walkbtn">1인칭으로 걸어보기</button>
  <div class="stats" id="stats"></div>
</header>
<script>
(function(){const b=document.body,opt=document.getElementById('optBtn'),min=document.getElementById('minBtn');
 const narrow=matchMedia('(max-width:640px)').matches;
 function setOpt(on){b.classList.toggle('optopen',on);opt.setAttribute('aria-expanded',on);opt.textContent=on?'옵션 닫기':'옵션';}
 function setMin(on){b.classList.toggle('pmin',on);min.setAttribute('aria-expanded',!on);min.textContent=on?'메뉴':'접기';}
 setOpt(!narrow);setMin(false);
 opt.onclick=()=>setOpt(!b.classList.contains('optopen'));min.onclick=()=>setMin(!b.classList.contains('pmin'));})();
</script>

<aside class="card" id="card" hidden>
  <h2 id="c-name">거실</h2>
  <dl>
    <dt>크기</dt><dd id="c-size"></dd>
    <dt>면적</dt><dd id="c-area"></dd>
    <dt>평수</dt><dd id="c-py"></dd>
  </dl>
  <button class="walk" id="c-walk">방 안에서 보기</button>
</aside>

<div class="bar">

  <button id="reset">전체 보기</button>
</div>

  if(o.hole)mk(BX(Math.min(0.1,w*0.4),0.025,0.004),gm(0x8f887a),0,h*0.75,0.022,mov);
  const hc=o.hc||0xc9a45c;if(o.knob===false){}else if(w>0.55){setPart(mk(BX(Math.min(0.18,w*0.3),0.016,0.016),gm(hc,{metalness:0.8,roughness:0.3}),0,h*0.62,0.03,mov),c,'hit');}
  else setPart(mk(new THREE.SphereGeometry(0.015,12,8),gm(hc,{metalness:0.85,roughness:0.3}),0,h*0.6,0.03,mov),c,'hit');

  setPart(mk(BX(w-0.05,0.01,TD),IN,0,0.025,TZ,tray),c,'cav');
  const sh=Math.max(0.05,h*0.6);mk(BX(0.01,sh,TD),IN,-(w-0.05)/2,0.025+sh/2,TZ,tray);mk(BX(0.01,sh,TD),IN,(w-0.05)/2,0.025+sh/2,TZ,tray);mk(BX(w-0.05,sh,0.01),IN,0,0.025+sh/2,-d+0.035,tray);
  const vol=setPart(mk(BX(w-0.03,h,d-0.04),INVIS,0,h/2,-d/2,tray),c,'cav');vol.userData.solid=true;

  S.cam={p0:camera.position.clone(),p1:p,y0:WALK.yaw,y1:WALK.yaw+angDiff(WALK.yaw,yaw),q0:WALK.pitch,q1:pitch,t:0,dur:0.7};S.camHold=null;WALK.auto=null;WALK.wheel=WALK.strafe=0;}

// 짧게 누르기
window.gameTap=function(x,y,type){if(!['hide','seek','reveal'].includes(S.phase))return false;const h=pickAt(x,y);
  if(S.phase==='seek'){const di0=h?dollOf(h.object):null;if(!(di0!=null&&S.dolls[di0]&&S.dolls[di0].g&&!S.dolls[di0].found&&h.distance<G_REACH+1.5)){const nd=nearDoll(x,y);if(nd!=null){foundDoll(nd);return true;}}}
  if(!h)return false;
  const d=h.distance,o=h.object;const di=dollOf(o);
  if(di!=null&&S.dolls[di]&&S.dolls[di].g){if(S.phase==='hide'&&d<G_REACH+1){removeDoll(di);renderIcons();updHideGuide();say('인형을 다시 가져왔어요',900);return true;}
    if(S.phase==='seek'&&!S.dolls[di].found&&d<G_REACH+1.5){foundDoll(di);return true;}return false;}
  let c=o.userData.cont||contOf(o);
  // 열린 장의 안쪽 판(칸막이·옆판)을 눌러도 그 장으로 침 → 누르면 닫힘
  if(!c&&d<G_REACH+1){const bb=new THREE.Box3(),w=new THREE.Vector3();let oc=null,od=1e9;CONTS.forEach(q=>{if(q.fixed||q.amt<=0.5||!bb.setFromObject(q.G).expandByScalar(0.05).containsPoint(h.point))return;const k=bb.getCenter(w).distanceTo(h.point);if(k<od){od=k;oc=q;}});if(oc){toggle(oc);return true;}}
  if(c&&c.fixed){if(S.phase==='hide'&&d<G_REACH){const i=nextFree();if(i<0){say('인형을 모두 숨겼어요');return true;}const r=c.place(h.point);r.cont=c;putDoll(i,r,c.name);unwall(S.dolls[i].g);sPlace();renderIcons();updHideGuide();return true;}return false;}
  if(c&&d<G_REACH){const role=o.userData.role||'hit';
    if(role==='cav'&&S.phase==='hide'&&c.amt>0.6){const i=nextFree();if(i<0){say('인형을 모두 숨겼어요');return true;}const r=c.place(h.point);r.cont=c;putDoll(i,r,c.name);unwall(S.dolls[i].g);sPlace();renderIcons();updHideGuide();setTimeout(()=>{c.tgt=0;if(c.pair)c.pair.tgt=0;},750);return true;}
    toggle(c);return true;}
  if(S.phase==='hide'&&d<G_REACH&&!c){const n=nrm(h);const isFloor=floors.includes(o);
    if(n.y>0.6&&(!isFloor||coverDist(h.point)<1.6)){placeFree(h);return true;}}
  return false;};
// 길게 누르기: 바닥 포함 아무 데나 놓기
window.gameLong=function(x,y){if(S.phase!=='hide')return;const h=pickAt(x,y);if(!h||h.distance>G_REACH+0.5)return;if(dollOf(h.object)!=null)return;
  const c=contOf(h.object);if(c){if(c.amt>0.6){const i=nextFree();if(i<0)return;const r=c.place(h.point);r.cont=c;putDoll(i,r,c.name);unwall(S.dolls[i].g);sPlace();renderIcons();updHideGuide();}return;}
  if(nrm(h).y>0.5)placeFree(h);};
function placeFree(h){const i=nextFree();if(i<0){say('인형을 모두 숨겼어요');return;}if(h.point.z>Z(14.12)){say('난간 밖에는 못 숨겨요',1100);return;}const cd=coverDist(h.point);if(cd<0.07){say('여기는 너무 좁아서 안 들어가요',1100);return;}
  putDoll(i,{parent:scene,pos:h.point.clone().add(new THREE.Vector3(0,0.002,0)),s:fit(cd-0.01)},roomName(h.point)+(floors.includes(h.object)?' 바닥':''));unwall(S.dolls[i].g);sPlace();renderIcons();updHideGuide();}

// ---------- 매 프레임 ----------
let lastT=performance.now();
const sofaRC=new THREE.Raycaster();
function sofaLift(dt){if(!WALK.on||S.cam)return;let gy=0;const cp=camera.position;
  if(SOFA_BOX.some(b=>cp.x>b.min.x&&cp.x<b.max.x&&cp.z>b.min.z&&cp.z<b.max.z)){sofaRC.set(new THREE.Vector3(cp.x,1.5,cp.z),new THREE.Vector3(0,-1,0));sofaRC.far=1.6;
    const h=sofaRC.intersectObjects(SOFA_M.filter(m=>{let o=m;while(o){if(!o.visible)return false;o=o.parent;}return true;}),false).find(h=>h.point.y<0.62);if(h)gy=h.point.y;}
  S.ground=(S.ground||0)+(gy-(S.ground||0))*Math.min(1,dt*7);if(!S.camHold)cp.y=WALK.eye+S.ground;}
function tick(now){requestAnimationFrame(tick);const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;sofaLift(dt);
  CONTS.forEach(c=>{if(c.fixed)return;if(Math.abs(c.amt-c.tgt)>0.001){c.amt+=Math.sign(c.tgt-c.amt)*Math.min(Math.abs(c.tgt-c.amt),dt*3.2*(c.speed||1));c.onAmt&&c.onAmt(THREE.MathUtils.smoothstep(c.amt,0,1));
    const v=c.amt>0.01;c.inner.forEach(m=>m.visible=v);}});
  S.dolls.forEach(d=>{if(!d.g)return;if(d.anim){d.anim.t+=dt;const k=d.anim.t/0.9;d.g.position.set(d.anim.p.x,d.anim.p.y+Math.sin(Math.min(1,k)*Math.PI*0.5)*0.35,d.anim.p.z);d.g.rotation.y+=dt*9;d.g.scale.setScalar(d.anim.s*Math.max(0.001,1+0.6*k-1.6*k*k));if(k>=1){d.g.visible=false;d.anim=null;}return;}
    const sh=d.cont&&d.cont.shows?d.cont.shows(d.g):null;
    if(d.bump)d.bump.visible=sh!=null?!sh:d.cont&&d.cont.amt<0.03;
    if(d.found)return;if(d.cont)d.g.visible=sh!=null?sh:d.cont.amt>(d.cont.gate||0.3);});
  beacons.forEach((b,i)=>{b.material.opacity=0.2+0.12*Math.sin(now/300+i);});
  if(S.phase==='hide'||S.phase==='seek'){let n=0;const cp=camera.position,wp=new THREE.Vector3();
    CONTS.forEach(c=>{if(c.fixed||c.tgt<=0.5)return;(c.mov||c.G).getWorldPosition(wp);if(!S.cam&&Math.hypot(wp.x-cp.x,wp.z-cp.z)>4.2)c.tgt=0;else n++;});
    if(n!==S.openN){S.openN=n;refreshBtns();}}
  if(S.cam){const C=S.cam;C.t+=dt;const k=THREE.MathUtils.smootherstep(Math.min(1,C.t/C.dur),0,1);camera.position.lerpVectors(C.p0,C.p1,k);
    WALK.yaw=C.y0+(C.y1-C.y0)*k;WALK.pitch=C.q0+(C.q1-C.q0)*k;applyLook();WALK.auto=null;if(C.t>=C.dur){S.cam=null;S.camHold={x:camera.position.x,z:camera.position.z};}}
  else if(S.camHold){const m=Math.hypot(camera.position.x-S.camHold.x,camera.position.z-S.camHold.z);
    if(m>0.04){const ty=WALK.eye+(S.ground||0);camera.position.y+=(ty-camera.position.y)*Math.min(1,dt*5);if(Math.abs(camera.position.y-ty)<0.01){camera.position.y=ty;S.camHold=null;}}}
  if(S.phase==='seek'&&!S.paused){S.elapsed=(now-S.t0)/1000;const tm=$('#gTime');if(S.limit){const rem=S.limit-S.elapsed;tm.textContent='⏱ '+fmt(Math.ceil(rem));tm.classList.toggle('warn',rem<=30);if(rem<=0)endGame(false);}else{tm.textContent='⏱ '+fmt(S.elapsed);tm.classList.remove('warn');}}}

// ---------- 시작 ----------
function init(){['showFrames','showSug'].forEach(id=>{const e=document.getElementById(id);if(e&&e.checked){e.checked=false;e.dispatchEvent(new Event('change'));}});
  buildConts();wallSafeConts();deSparkle();buildFurn();{const seen=new Set();scene.traverse(o=>{if(!o.isMesh||!o.userData.game)return;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m&&!seen.has(m)){seen.add(m);envFix(m);}});});}requestAnimationFrame(tick);showMenu();walkStart(7.0,7.3,Math.PI);}
init();
window.__G={S,CONTS,OPENERS,blockNow:()=>BLOCK,toggleC:toggle,buildPS,makePerson,FAM,roomName,wallMeshes,unwall,wallHits,sightOK,contSight,autoPick,castAll,FG,putDoll,hint,startSeek,startHide,autoRest,doneHide,endGame,reveal,toggle,camTo,setPose,camera,WALK,applyLook};
})();
})();
