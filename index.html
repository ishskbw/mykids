<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>우리 아이들 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#F3F4EE;--surface:#FFFFFF;--ink:#1E2722;--muted:#5B6860;--line:#DADFD3;--sign:#6B3A1E;--route:#1C6A47;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#131915;--surface:#1B231E;--ink:#E7ECE5;--muted:#9AA79E;--line:#2C3631;--sign:#A9673F;--route:#56B386;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6}
main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:56px}
h1{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 32px}
.links{display:grid;gap:12px;list-style:none;padding:0;margin:0}
.links a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
.links a:hover,.links a:focus-visible{border-color:var(--route);outline:none}
.links strong{display:block;font-size:17px}
.links span{color:var(--muted);font-size:14px}
.arrow{color:var(--route);font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>우리 아이들 홈</h1>
  <p class="lead">아이들과 보내는 시간을 위해 모아둔 것들.</p>
  <ul class="links">
    <li><a href="/weekend/"><div><strong>Yooniverse 주말 나들이</strong><span>차로 2시간 안에 갈 수 있는 이번 주말 축제·행사 순위</span></div><span class="arrow">열기 →</span></a></li>
  </ul>
</main>
</body>
</html>
